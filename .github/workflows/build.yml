name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o seo-hacker-browser.zip
          # agar files subfolder mein aa jayein to fix
          if [ -d "seo-hacker-browser" ]; then
            cp -r seo-hacker-browser/* .
            rm -rf seo-hacker-browser
          fi

      - name: Create missing proguard file
        run: echo "# keep" > app/proguard-rules.pro

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SeoHackerBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
