name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source from zip
        run: |
          echo "---- files at repo root ----"
          ls -la
          if [ ! -f seo-hacker-browser.zip ]; then
            echo "ERROR: seo-hacker-browser.zip not found at repo root"
            exit 1
          fi
          unzip -o seo-hacker-browser.zip -d _uz
          SETTING=$(find _uz -name "settings.gradle.kts" | head -1)
          if [ -z "$SETTING" ]; then
            echo "ERROR: settings.gradle.kts not found in zip"
            find _uz -type f | head -80
            exit 1
          fi
          SRC=$(dirname "$SETTING")
          echo "Source dir: $SRC"
          cp -a "$SRC"/. .
          rm -rf _uz seo-hacker-browser.zip
          echo "---- repo root after extract ----"
          ls -la
          test -f settings.gradle.kts && echo "OK settings"
          test -f app/build.gradle.kts && echo "OK app gradle"
          test -f app/src/main/AndroidManifest.xml && echo "OK manifest"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
